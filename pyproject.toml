[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-reply-drafter"
version = "0.2.0"
description = "Triage and reply drafting for a Jira Service Management help queue (dry run)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reply_drafter"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
